name: Docker Build on Tag

on:
  release:
    types: [published]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - uses: google-github-actions/auth@v2
      with:
        project_id: 'genuine-flight-317411'
        workload_identity_provider: 'projects/429189597230/locations/global/workloadIdentityPools/github/providers/robusta-repos' # prod

    - name: Set up gcloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: genuine-flight-317411

    - name: Configure Docker Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev


    - name: Update package version
      env:
        TAG: ${{ github.ref_name }}
      run: |
        sed -i "s/__version__ = .*/__version__ = \"$TAG\"/g" mavrick/__init__.py
        sed -i "s/0.0.0/$TAG/g" helm/mavrick/Chart.yaml helm/mavrick/values.yaml
        sed -i "s/0.0.1/$TAG/g" helm/mavrick/Chart.yaml

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Mavrick Docker images
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/arm64,linux/amd64
        push: true
        tags: |
          us-central1-docker.pkg.dev/genuine-flight-317411/devel/mavrick:${{ github.ref_name }}
          robustadev/mavrick:${{ github.ref_name }}
        build-args: |
          BUILDKIT_INLINE_CACHE=1

    - name: Build and push Mavrick Operator Docker images
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.operator
        platforms: linux/arm64,linux/amd64
        push: true
        tags: |
          us-central1-docker.pkg.dev/genuine-flight-317411/devel/mavrick-operator:${{ github.ref_name }}
          robustadev/mavrick-operator:${{ github.ref_name }}
        build-args: |
          BUILDKIT_INLINE_CACHE=1

    # Note: this ignores the "Set as latest release" checkbox in the GitHub UI
    # it isn't possible to check whether that was set or not
    # so if you do not want to override the "latest" tag, you should mark the release as a prerelease or a draft
    # for prereleases and drafts we don't tag latest
    - name: Tag and push Docker images as latest if applicable
      if: ${{ github.event.release.prerelease == false && github.event.release.draft == false }}
      env:
        TAG: ${{ github.ref_name }}
      run: |
        # Tag Mavrick as latest (preserves multi-arch manifest)
        docker buildx imagetools create \
          --tag us-central1-docker.pkg.dev/genuine-flight-317411/devel/mavrick:latest \
          --tag robustadev/mavrick:latest \
          "us-central1-docker.pkg.dev/genuine-flight-317411/devel/mavrick:$TAG"

        # Tag Mavrick Operator as latest (preserves multi-arch manifest)
        docker buildx imagetools create \
          --tag us-central1-docker.pkg.dev/genuine-flight-317411/devel/mavrick-operator:latest \
          --tag robustadev/mavrick-operator:latest \
          "us-central1-docker.pkg.dev/genuine-flight-317411/devel/mavrick-operator:$TAG"

    - name: Save artifact with helm chart
      uses: actions/upload-artifact@v4
      with:
        name: helm-chart
        path: helm/mavrick/

    - name: Upload helm chart
      run: |
        cd helm && ./upload_chart.sh

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}   
    - name: Push Helm chart to OCI registry
      env:
        TAG: ${{ github.ref_name }}
      run: |
        helm package helm/mavrick
        helm push "mavrick-$TAG.tgz" oci://ghcr.io/mavrickgpt/charts
