{{- if and .Values.mcpAddons.prefect.enabled .Values.mcpAddons.prefect.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-prefect-mcp-network-policy
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-prefect-mcp
    app.kubernetes.io/name: prefect-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: mavrick
    {{- include "mavrick.commonLabels" . | nindent 4 }}
  {{- with (include "mavrick.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-prefect-mcp
      app.kubernetes.io/name: prefect-mcp-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
  - Ingress
  ingress:
  # Allow traffic only from Mavrick pods
  - from:
    - podSelector:
        matchLabels:
          app: mavrick
    ports:
    - protocol: TCP
      port: 8000
{{- end }}
